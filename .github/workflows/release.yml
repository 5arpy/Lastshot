name: Release

# Push a tag like `v1.7.0` (or run this by hand) to build Lastshot on a
# Windows runner and publish a GitHub Release with:
#   - the NSIS installer (Lastshot_<version>_x64-setup.exe)
#   - the plain lastshot.exe, for people who want a portable copy
#
# Lastshot does not update itself, so nothing is signed for an updater; the
# app only checks the latest release tag and opens the download page.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action's vite build does not type-check, so gate the release on
      # the same checks CI runs.
      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --release --lib

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Lastshot v__VERSION__"
          releaseBody: |
            **Download:** `Lastshot_…_x64-setup.exe` below, run it, done. Or grab `lastshot.exe` for a portable copy (needs Microsoft Edge WebView2, which Windows 10/11 already have).

            Windows may show "Windows protected your PC" because the installer is not code-signed (that costs money every year). Click **More info → Run anyway**.

            See CHANGELOG.md for what changed.
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true
