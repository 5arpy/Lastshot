name: Release

# Push a tag like `v1.7.0` (or run this by hand) to build Lastshot on a
# Windows runner and publish a GitHub Release with:
#   - the NSIS installer (Lastshot_<version>_x64-setup.exe)
#   - the plain exe (lastshot_windows_x64.exe), for a portable copy
#
# Lastshot does not update itself, so nothing is signed for an updater; the
# app only checks the latest release tag and opens the download page.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # `tauri build` links the C runtime statically only if this is set while
      # tauri-build's script runs. Set for every cargo step, so a script the
      # test step (or the cache) ran can't drop it: such an exe needs
      # vcruntime140.dll and won't start without the VC++ redistributable.
      STATIC_VCRUNTIME: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action's vite build does not type-check, so gate the release on
      # the same checks CI runs.
      - name: Typecheck and unit tests
        run: npm run typecheck && npm test

      # tauri::generate_context! embeds ../dist at compile time, so the
      # frontend has to be built before cargo can compile the tests.
      - name: Rust unit tests
        run: |
          npm run build
          cargo test --release --lib --manifest-path src-tauri/Cargo.toml

      # Build once before publishing and refuse an exe that needs the VC++
      # redistributable (tauri-action below reuses this build).
      - name: Build the exe and check its imports
        shell: pwsh
        run: |
          npx tauri build --no-bundle
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /nologo /dependents src-tauri\target\release\lastshot.exe
          $deps
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          if ($deps -match '(?i)vcruntime140|msvcp140') { throw "lastshot.exe imports the VC++ runtime: it would not start on PCs without the redistributable" }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Lastshot v__VERSION__"
          releaseBody: |
            **Download:** `Lastshot_…_x64-setup.exe` below, run it, done. Or grab `lastshot_windows_x64.exe` for a portable copy (needs Microsoft Edge WebView2, which Windows 10/11 already have).

            Windows may show "Windows protected your PC" because the installer is not code-signed (that costs money every year). Click **More info → Run anyway**.

            See CHANGELOG.md for what changed.
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true
