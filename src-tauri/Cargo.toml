[package]
name = "lastshot"
version = "1.9.0"
description = "Lastshot - free instant replay & snipping tool for Windows. No account, fully local."
authors = ["5arpy", "jaimitus", "drexjgobgt"]
license = "MIT"
repository = "https://github.com/5arpy/Lastshot"
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri v2 builds; `main.rs` is a 6-line shim so that the
# same crate can be consumed by integration tests / benches.
[lib]
name = "lastshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
# ---------------------------------------------------------------- Tauri core
tauri = { version = "2.1.1", features = [
    "tray-icon",
    "image-png",
    "protocol-asset",
    "devtools",
] }
tauri-plugin-global-shortcut = "2.0.1"
tauri-plugin-opener = "2.2.2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2.0.4"
tauri-plugin-notification = "2.0.1"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"

# ---------------------------------------------------------- Serialization/IO
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "sync", "time", "macros"] }

# ------------------------------------------------------------ Sync / plumbing
parking_lot = "0.12.3"
thiserror = "2.0.6"
log = "0.4.22"
env_logger = "0.11.5"
chrono = { version = "0.4.39", features = ["clock"] }
base64 = "0.22.1"

# Thumbnail encoding only - no decoders pulled in, keeps the binary tiny.
image = { version = "0.25.5", default-features = false, features = ["png"] }

# ------------------------------------------------- Windows Graphics / Media
# Everything below is compiled only on Windows targets. The feature list is
# deliberately narrow so link time and binary size stay minimal.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    # Window/app capture (Windows.Graphics.Capture) and the GPU compositor.
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D_Fxc",
    # COM callbacks (per-app sound activation).
    "implement",
    # Audio tab: Voicemeeter's Remote DLL (loaded from its install folder)
    # and its install path in the registry.
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    # Audio tab → Cables: endpoint → USB device lookup, installer checks.
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Variant",
    # Audio tab → Devices: device meters and the microphone mute.
    "Win32_Media_Audio_Endpoints",
]

[target.'cfg(windows)'.dependencies]
windows-core = "0.58.0"
# Already in the build (tauri-plugin-notification uses it); used directly for
# the Audio guard's "Restore mine / Keep new" buttons. MIT/Apache-2.0.
tauri-winrt-notification = "0.7.3"
# Same version Tauri's WebView2 layer uses (no extra download): lets the
# Studio layer window use the webcam without a permission prompt.
webview2-com = "0.38"

[features]
# Allows `cargo run --features headless-sim` on non-Windows dev machines: the
# capture engine falls back to a deterministic synthetic pipeline so the whole
# IPC surface (and therefore the UI) stays testable on macOS/Linux CI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
headless-sim = []
# Lastshot Pro: the Reference board and live pop-outs (src/pro_board.rs,
# src/pro/). Off in the free build.
pro-board = []

[profile.dev]
incremental = true

[profile.release]
# Speed-optimised: the DXGI capture loop, colour converter and ring buffer
# hot paths benefit far more from inlining/vectorisation than a 1-2 MB
# binary size saving. Installer size increase is negligible for a desktop app.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
